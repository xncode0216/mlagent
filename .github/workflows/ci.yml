name: CI

# PR 闸门：后端 ruff + pytest，前端 eslint + tsc + vitest + build。
# 在 ubuntu-latest 上跑（Windows 本地的 vite/esbuild 沙箱限制不适用于 Linux runner）。
on:
  pull_request:
  push:
    branches: [master]

# 同一分支新推送时取消进行中的旧运行，省额度。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小权限：CI 只需读取代码。
permissions:
  contents: read

jobs:
  backend:
    name: 后端 ruff + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: 安装依赖（含 dev：pytest/ruff/httpx）
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff 静态检查
        run: ruff check app tests

      - name: pytest 单元测试
        run: pytest -q

  frontend:
    name: 前端 eslint + tsc + vitest + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖（npm ci，遵循 lockfile）
        run: npm ci

      - name: eslint 静态检查
        run: npm run lint

      - name: vitest 单元测试
        run: npm run test

      - name: 构建（tsc -b 类型检查 + vite build）
        run: npm run build
