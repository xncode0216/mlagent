services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mlagent
      POSTGRES_PASSWORD: mlagent
      POSTGRES_DB: mlagent
    ports:
      - "5432:5432"
    volumes:
      - mlagent_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlagent -d mlagent"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - mlagent_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mlagent_postgres:
  mlagent_redis:
